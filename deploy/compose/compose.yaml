# ─────────────────────────────────────────────────────────────────────────────
# Euron Open Talent: local stack (cloud-agnostic base).
#
# Never run this file alone. Pair it with a cloud overlay:
#   make up        # = compose.yaml + compose.floci.yaml  (emulated AWS, no account needed)
#   make up-aws    # = compose.yaml + compose.aws.yaml    (real AWS resources)
#
# On its own the base keeps media on a volume (STORAGE=local) and sends mail straight
# to Mailpit (MAIL_MODE=smtp); the overlays switch both to S3 and SES.
#
# Secrets come from deploy/compose/.env, generated by `make env`
# (scripts/gen-local-env.sh). They are random, local-only throwaways. `make up-aws`
# also reads deploy/compose/.env.aws, whose values win over the defaults here.
#
# Host ports (override in .env, or in your shell, if they clash with something else):
#   web 3520   api 5016   postgres 5482   redis 6419   mailpit 8036 (smtp 1036)
#   floci 4587   ai stub 5109
#
# The browser only ever talks to the web app: it proxies /api/* and /socket.io/* to the
# API (API_INTERNAL_URL), so the refresh cookie is first-party, exactly as behind the
# load balancer on AWS. The API port is published for curl and the integration tools.
# ─────────────────────────────────────────────────────────────────────────────
name: open-talent

# Every value an overlay or an env file may want to change is a ${NAME:-default}
# interpolation under the variable's own name, so `--env-file .env.aws` (make up-aws)
# and your shell can set it; the overlays then set their own values on top. Precedence,
# highest first: an overlay's `environment:`, your shell, the last --env-file
# (.env.aws for up-aws, then .env), the default below. Keys the base does not set at
# all (S3_BUCKET, MEDIA_ORIGINS, ...) also reach the containers through the overlay's
# `env_file:`.
x-api-env: &api-env
  # Development mode keeps the production guards as warnings: the local stack talks to
  # an emulator and links to localhost, both of which production refuses on purpose.
  NODE_ENV: development
  TZ: UTC
  PORT: "5016"
  LOG_LEVEL: ${LOG_LEVEL:-${TALENT_LOG_LEVEL:-info}}
  PRODUCT_NAME: ${PRODUCT_NAME:-${TALENT_PRODUCT_NAME:-Euron Open Talent}}
  APP_WEB_URL: http://localhost:${TALENT_WEB_PORT:-3520}
  # Same origin as the web app: the browser reaches the API through the web proxy.
  PUBLIC_API_URL: http://localhost:${TALENT_WEB_PORT:-3520}
  CORS_ORIGINS: http://localhost:${TALENT_WEB_PORT:-3520}
  TRUST_PROXY: "1"
  DATABASE_URL: postgres://talent:talent@postgres:5432/talent
  DB_POOL_MAX: ${DB_POOL_MAX:-10}
  # Migrations run once, in the `migrate` one-shot, before the API and worker start.
  MIGRATE_ON_BOOT: "false"
  REDIS_URL: redis://redis:6379
  JOBS_MODE: queue
  JWT_SECRET: ${TALENT_JWT_SECRET:?run `make env` first}
  REFRESH_SECRET: ${TALENT_REFRESH_SECRET:?run `make env` first}
  # 32 random bytes, base64: encrypts stored TOTP secrets. `make env` adds it to an
  # existing .env as well.
  TOTP_ENCRYPTION_KEY: ${TALENT_TOTP_ENCRYPTION_KEY:?run `make env` first}
  COOKIE_SECURE: "false"
  REQUIRE_EMAIL_VERIFICATION: ${REQUIRE_EMAIL_VERIFICATION:-true}
  STORAGE: ${STORAGE:-local}
  DATA_DIR: /app/data
  MAIL_MODE: ${MAIL_MODE:-smtp}
  MAIL_FROM: ${MAIL_FROM:-${TALENT_PRODUCT_NAME:-Euron Open Talent} <no-reply@talent.example.test>}
  SMTP_HOST: ${SMTP_HOST:-mailpit}
  SMTP_PORT: ${SMTP_PORT:-1025}
  MODERATION_PROVIDER: ${MODERATION_PROVIDER:-stub}
  MODERATION_STUB_URL: ${MODERATION_STUB_URL:-http://ai-stub:5109}
  # AI import, badges and polish. The stack starts on the deterministic stub so the
  # import wizard works with no key; set AI_PROVIDER=openai (or gemini) plus the key in
  # .env to use a real model, or AI_PROVIDER=none to hide AI features.
  AI_PROVIDER: ${AI_PROVIDER:-stub}
  AI_STUB_URL: ${AI_STUB_URL:-http://ai-stub:5109}
  OPENAI_API_KEY: ${OPENAI_API_KEY:-}
  OPENAI_MODEL: ${OPENAI_MODEL:-gpt-4o-mini}
  GEMINI_API_KEY: ${GEMINI_API_KEY:-}
  # Salts the per-day profile view keys so raw IPs are never stored.
  VIEW_HASH_SALT: ${TALENT_VIEW_HASH_SALT:?run `make env` first}

# api, worker and migrate are one image with three commands. Each carries the same build
# so any of them can be started alone; BuildKit builds it once and reuses the cache.
x-api-build: &api-build
  context: ../..
  dockerfile: infra/docker/api.Dockerfile

services:
  postgres:
    image: postgres:16.12-alpine
    environment:
      POSTGRES_DB: talent
      POSTGRES_USER: talent
      POSTGRES_PASSWORD: talent
    ports:
      - "127.0.0.1:${TALENT_PG_PORT:-5482}:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U talent -d talent"]
      interval: 3s
      timeout: 3s
      retries: 30

  # BullMQ, the Socket.IO adapter, rate limits and presence. A plain container in every
  # local setup; ElastiCache (infra/terraform/modules/cache) on AWS.
  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "127.0.0.1:${TALENT_REDIS_PORT:-6419}:6379"
    volumes:
      - redisdata:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 3s
      timeout: 3s
      retries: 30

  # Every mail the stack sends lands here (directly with MAIL_MODE=smtp, or relayed by
  # the emulator's SES with MAIL_MODE=ses). Web UI: http://localhost:8036
  mailpit:
    image: axllent/mailpit:v1.27.9
    ports:
      - "127.0.0.1:${TALENT_MAILPIT_PORT:-8036}:8025"
      # SMTP, for MAIL_MODE=smtp (the integration matrix sends straight to it).
      - "127.0.0.1:${TALENT_SMTP_PORT:-1036}:1025"

  # Fake AI provider (AI_PROVIDER=stub, MODERATION_PROVIDER=stub): deterministic
  # moderation scores, profile extraction and transcription, so every AI flow works
  # without a provider key.
  ai-stub:
    build:
      context: ../..
      dockerfile: infra/docker/ai-stub.Dockerfile
    image: open-talent-ai-stub:local
    environment:
      PORT: "5109"
    ports:
      - "127.0.0.1:${TALENT_STUB_PORT:-5109}:5109"
    restart: unless-stopped

  # One-shot: apply db/migrations, then exit 0. The API and worker wait for it.
  migrate:
    build: *api-build
    image: open-talent-api:local
    command: ["node", "--enable-source-maps", "dist/migrate.js"]
    environment:
      <<: *api-env
    healthcheck:
      disable: true
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  api:
    build: *api-build
    image: open-talent-api:local
    command: ["node", "--enable-source-maps", "dist/index.js"]
    environment:
      <<: *api-env
    ports:
      - "127.0.0.1:${TALENT_API_PORT:-5016}:5016"
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
      ai-stub:
        condition: service_started
    restart: unless-stopped

  worker:
    build: *api-build
    image: open-talent-api:local
    command: ["node", "--enable-source-maps", "dist/worker.js"]
    environment:
      <<: *api-env
    volumes:
      - mediadata:/app/data
    tmpfs:
      - /tmp:uid=1000,gid=1000
    # No HTTP port: the image's /up check does not apply.
    healthcheck:
      disable: true
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    restart: unless-stopped

  web:
    build:
      context: ../..
      dockerfile: infra/docker/web.Dockerfile
      args:
        API_INTERNAL_URL: http://api:5016
    image: open-talent-web:local
    environment:
      # Server side only: where the Next server proxies /api/* and /socket.io/*.
      API_INTERNAL_URL: http://api:5016
      PRODUCT_NAME: ${PRODUCT_NAME:-${TALENT_PRODUCT_NAME:-Euron Open Talent}}
    ports:
      - "127.0.0.1:${TALENT_WEB_PORT:-3520}:3000"
    depends_on:
      api:
        condition: service_started
    restart: unless-stopped

volumes:
  pgdata:
  redisdata:
  mediadata:
