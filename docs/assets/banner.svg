<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="320" viewBox="0 0 1280 320" role="img" aria-labelledby="t d">
  <title id="t">Euron Open Talent</title>
  <desc id="d">Open-source, self-hosted professional network: talent pages, verified recruiters and companies, jobs with a live hiring pipeline and consent-based contact unlock, built for AWS</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0f1c"/>
      <stop offset="1" stop-color="#0f1730"/>
    </linearGradient>
    <linearGradient id="glow" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#5b8cff" stop-opacity="0.1"/>
      <stop offset="1" stop-color="#5b8cff" stop-opacity="0.85"/>
    </linearGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#ffffff" stroke-opacity="0.035"/>
    </pattern>
  </defs>
  <rect width="1280" height="320" rx="16" fill="url(#bg)"/>
  <rect width="1280" height="320" rx="16" fill="url(#grid)"/>

  <g font-family="Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif">
    <text x="72" y="128" fill="#f3f6ff" font-size="54" font-weight="650" letter-spacing="-1.2">Euron Open Talent</text>
    <text x="74" y="172" fill="#97a3c2" font-size="22" font-weight="400">Talent pages, verified recruiters and a live hiring pipeline,</text>
    <text x="74" y="202" fill="#97a3c2" font-size="22" font-weight="400">on infrastructure you own.</text>
    <text x="74" y="252" font-family="JetBrains Mono, SFMono-Regular, Menlo, monospace" font-size="15" fill="#7f8bab" xml:space="preserve">Consent-based contact<tspan fill="#2a3352">  /  </tspan>Socket.IO pipeline<tspan fill="#2a3352">  /  </tspan>Terraform for AWS<tspan fill="#2a3352">  /  </tspan>MIT</text>
  </g>

  <!-- Motif: a talent card with hidden contact, a verified job card with a pipeline, and a key -->
  <g transform="translate(858 30)">
    <!-- talent card -->
    <rect x="0" y="0" width="230" height="156" rx="14" fill="#121a33" stroke="#26315a"/>
    <circle cx="40" cy="42" r="22" fill="none" stroke="#34d399" stroke-width="3" stroke-opacity="0.85"/>
    <circle cx="40" cy="42" r="16" fill="#5b8cff" fill-opacity="0.85"/>
    <rect x="74" y="30" width="112" height="10" rx="5" fill="#3a4672"/>
    <rect x="74" y="48" width="84" height="8" rx="4" fill="#26315a"/>
    <rect x="20" y="80" width="46" height="16" rx="5" fill="#1a2446" stroke="#2c3866"/>
    <rect x="72" y="80" width="58" height="16" rx="5" fill="#1a2446" stroke="#2c3866"/>
    <rect x="136" y="80" width="38" height="16" rx="5" fill="#1a2446" stroke="#2c3866"/>
    <!-- hidden contact row -->
    <g transform="translate(20 116)">
      <rect x="0" y="6" width="14" height="11" rx="2.5" fill="#fbbf24" fill-opacity="0.9"/>
      <path d="M3 6 V3.5 a4 4 0 0 1 8 0 V6" fill="none" stroke="#fbbf24" stroke-width="2"/>
      <circle cx="30" cy="12" r="3" fill="#3a4672"/><circle cx="40" cy="12" r="3" fill="#3a4672"/><circle cx="50" cy="12" r="3" fill="#3a4672"/><circle cx="60" cy="12" r="3" fill="#3a4672"/>
      <circle cx="78" cy="12" r="3" fill="#3a4672"/><circle cx="88" cy="12" r="3" fill="#3a4672"/><circle cx="98" cy="12" r="3" fill="#3a4672"/>
    </g>

    <g transform="translate(22 8)">
    <!-- job card -->
    <rect x="128" y="120" width="252" height="128" rx="14" fill="#141d3a" stroke="#2f3c6e"/>
    <rect x="148" y="140" width="30" height="30" rx="7" fill="#a78bfa" fill-opacity="0.85"/>
    <rect x="190" y="142" width="116" height="10" rx="5" fill="#3a4672"/>
    <rect x="190" y="160" width="74" height="8" rx="4" fill="#26315a"/>
    <circle cx="350" cy="152" r="11" fill="#34d399" fill-opacity="0.9"/>
    <path d="M345 152 l3.5 3.5 l6.5 -7" fill="none" stroke="#0a0f1c" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"/>
    <!-- mini pipeline -->
    <path d="M160 214 H344" stroke="#2c3866" stroke-width="3"/>
    <path d="M160 214 H252" stroke="#5b8cff" stroke-width="3"/>
    <circle cx="160" cy="214" r="8" fill="#5b8cff"/>
    <circle cx="206" cy="214" r="8" fill="#5b8cff"/>
    <circle cx="252" cy="214" r="9" fill="#0a0f1c" stroke="#5b8cff" stroke-width="3"/>
    <circle cx="298" cy="214" r="8" fill="#26315a"/>
    <circle cx="344" cy="214" r="8" fill="#26315a"/>

    </g>
    <!-- key -->
    <g transform="translate(300 26) rotate(-30)">
      <circle cx="0" cy="0" r="17" fill="none" stroke="#fbbf24" stroke-width="5"/>
      <path d="M17 0 H62 M48 0 V12 M58 0 V9" fill="none" stroke="#fbbf24" stroke-width="5" stroke-linecap="round"/>
    </g>
    <path d="M290 54 C270 100 190 128 132 128" fill="none" stroke="#fbbf24" stroke-opacity="0.45" stroke-width="1.6" stroke-dasharray="4 5"/>
  </g>
  <rect x="72" y="282" width="420" height="3" rx="1.5" fill="url(#glow)"/>
</svg>
