<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="690" viewBox="0 0 1280 690" role="img" aria-labelledby="t d">
  <title id="t">Consent-based contact unlock</title>
  <desc id="d">A verified recruiter sends an approach. The candidate sees the role, pay and message while their contact stays hidden, then accepts with chosen channels (email, phone, WhatsApp, each one individually), declines (which starts a cooldown) or blocks. After an accept the recruiter can reveal only the shared channels, and every reveal is logged in a contact access log the candidate can read. The candidate can revoke at any time. Each recruiter has a daily approach quota.</desc>
  <style>
    .t { font-family: Inter, -apple-system, Segoe UI, Helvetica, Arial, sans-serif; }
    .m { font-family: JetBrains Mono, SFMono-Regular, Menlo, monospace; }
    .h { font-size: 16px; font-weight: 650; fill: #edf1ff; }
    .s { font-size: 13px; fill: #97a3c2; }
    .x { font-size: 12px; fill: #6f7b9c; }
    .box { fill: #111833; stroke: #283258; stroke-width: 1.2; }
    .hot { fill: #111d3d; stroke: #5b8cff; stroke-opacity: 0.6; stroke-width: 1.4; }
    .bad { fill: #2a1420; stroke: #f87171; stroke-opacity: 0.55; stroke-width: 1.3; }
    .ok { fill: #0f2421; stroke: #34d399; stroke-opacity: 0.5; stroke-width: 1.3; }
    .warn { fill: #2a2312; stroke: #fbbf24; stroke-opacity: 0.55; stroke-width: 1.3; }
    .arrow { stroke: #4b5778; stroke-width: 1.6; fill: none; marker-end: url(#a); }
    .arrowhot { stroke: #5b8cff; stroke-opacity: 0.85; stroke-width: 1.6; fill: none; marker-end: url(#ah); }
    .life { stroke: #283258; stroke-width: 1.2; stroke-dasharray: 4 6; }
  </style>
  <defs>
    <marker id="a" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#4b5778"/></marker>
    <marker id="ah" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5b8cff"/></marker>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#fff" stroke-opacity="0.03"/></pattern>
  </defs>
  <rect width="1280" height="690" rx="16" fill="#0a0f1c"/>
  <rect width="1280" height="690" rx="16" fill="url(#grid)"/>
  <g class="t">
    <text class="h" x="40" y="52" style="font-size:22px">Contact unlock: consent per channel, every reveal on the record</text>
    <text class="s" x="40" y="76">Contact details leave the API only to a verified recruiter the person said yes to, only for the channels they chose.</text>

    <rect class="box" x="40" y="130" width="260" height="170" rx="12"/>
    <text class="h" x="60" y="164">Recruiter (verified)</text>
    <text class="s" x="60" y="188">ACTIVE recruiter of a company</text>
    <text class="m x" x="60" y="212">POST /api/approaches</text>
    <text class="s" x="60" y="236">role, message, pay, optional job</text>
    <text class="x" x="60" y="262">approachBlock(): no block, published</text>
    <text class="x" x="60" y="280">profile, one pending, cooldown, quota</text>

    <rect class="hot" x="350" y="130" width="260" height="170" rx="12"/>
    <text class="h" x="370" y="164">Candidate's inbox</text>
    <text class="s" x="370" y="188">sees the role, pay, company</text>
    <text class="s" x="370" y="206">and the message</text>
    <g transform="translate(370 222)">
      <rect x="0" y="6" width="13" height="10" rx="2.5" fill="#fbbf24" fill-opacity="0.9"/>
      <path d="M3 6 V3.5 a3.5 3.5 0 0 1 7 0 V6" fill="none" stroke="#fbbf24" stroke-width="1.8"/>
    </g>
    <text class="s" x="392" y="237" style="fill:#fbbf24">contact still hidden</text>
    <text class="x" x="370" y="262">approach:new arrives live</text>
    <text class="x" x="370" y="280">expires after 14 days if ignored</text>

    <rect class="ok" x="670" y="110" width="280" height="100" rx="12"/>
    <text class="h" x="690" y="140">Accept with channels</text>
    <text class="s" x="690" y="164">email, phone, WhatsApp: each</text>
    <text class="s" x="690" y="183">chosen one by one; opens a thread</text>
    <text class="x" x="690" y="201">the unlock stores channels, not values</text>

    <rect class="warn" x="670" y="222" width="280" height="70" rx="12"/>
    <text class="h" x="690" y="250">Decline</text>
    <text class="s" x="690" y="274">optional reason; 30 day cooldown</text>

    <rect class="bad" x="670" y="304" width="280" height="70" rx="12"/>
    <text class="h" x="690" y="332">Block</text>
    <text class="s" x="690" y="356">approach BLOCKED, user blocked</text>

    <rect class="box" x="670" y="390" width="280" height="80" rx="12"/>
    <text class="h" x="690" y="418">Revoke, any time later</text>
    <text class="s" x="690" y="440">reveals stop at once; thread stays</text>
    <text class="m x" x="690" y="459">POST /approaches/:id/revoke</text>

    <rect class="hot" x="990" y="110" width="250" height="134" rx="12"/>
    <text class="h" x="1010" y="140">Recruiter reveals</text>
    <text class="m x" x="1010" y="164">GET /approaches/:id/contact</text>
    <text class="s" x="1010" y="188">shared channels only, rest null</text>
    <text class="s" x="1010" y="208">only the recruiter who asked</text>
    <text class="x" x="1010" y="230">120 reveals per hour</text>

    <rect class="box" x="990" y="280" width="250" height="110" rx="12"/>
    <text class="h" x="1010" y="310">Contact access log</text>
    <text class="s" x="1010" y="334">one row per channel revealed,</text>
    <text class="s" x="1010" y="354">shown to the candidate: who,</text>
    <text class="s" x="1010" y="374">company, channel, when</text>

    <path class="arrowhot" d="M300 215 H346"/>
    <path class="arrowhot" d="M610 190 C640 190 640 160 666 160"/>
    <path class="arrow" d="M610 215 C640 215 640 257 666 257"/>
    <path class="arrow" d="M610 240 C640 240 640 339 666 339"/>
    <path class="arrowhot" d="M950 160 H986"/>
    <path class="arrow" d="M1115 244 V276"/>
    <text class="x" x="1124" y="265">same transaction</text>
    <path class="arrow" d="M950 430 H968 V226 H986" stroke-dasharray="5 5"/>

    <rect class="box" x="40" y="508" width="600" height="104" rx="12"/>
    <text class="h" x="60" y="540">Quota per recruiter per day</text>
    <text class="s" x="60" y="564">25 a day by default, or an operator's value for this recruiter;</text>
    <text class="s" x="60" y="584">approaches the classifier flagged are refunded</text>
    <text class="x" x="60" y="602">plus 60 an hour at the route, and one pending approach per pair</text>

    <rect class="box" x="670" y="508" width="570" height="104" rx="12"/>
    <text class="h" x="690" y="540">An unlock also ends when</text>
    <text class="s" x="690" y="564">there is a block either way, or the profile is suspended;</text>
    <text class="s" x="690" y="584">the recruiter leaves, is removed or is suspended</text>
    <text class="x" x="690" y="602">or either account is deleted; reinstating a recruiter restores nothing</text>

    <text class="x" x="40" y="652">Values are read from the profile at reveal time, so a changed number never lingers with recruiters. No public DTO carries a contact field.</text>
  </g>
</svg>
