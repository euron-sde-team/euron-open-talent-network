  - name: "comments"
    description: "replies, editing, deleting and reacting to comments."
  - name: "dms"
    description: "1:1 conversations, message requests, reactions, read state, archive and contacts."
  - name: "media"
    description: "direct-to-storage uploads, media lookup, and the local-storage stand-in for presigned URLs."
  - name: "notifications"
