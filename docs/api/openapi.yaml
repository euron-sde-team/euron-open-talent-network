  - name: "profiles"
    description: "the talent page, its editor, AI import, resume export, views and endorsements."
  - name: "network"
    description: "connections (one row per pair), invitations, people you may know."
  - name: "companies"
    description: "company pages. Page admins (OWNER, ADMIN) edit; operators verify (/api/admin)."
  - name: "recruiter"
    description: "register, confirm the work email, the account, saved candidates and searches, team notes."
  - name: "approaches"
    description: "a recruiter's structured outreach; the candidate shares contact channels by accepting."
  - name: "jobs"
    description: "postings, search, saved jobs, invitations to apply, Easy Apply and the pipeline board."
  - name: "applications"
    description: "your applications (candidate) and pipeline moves (the hiring team)."
  - name: "trust"
    description: "engagements (confirmed by both sides), double-blind ratings and complaints."
  - name: "search"
    description: "the talent directory, its facets, and the all-in-one typeahead."
  - name: "posts"
